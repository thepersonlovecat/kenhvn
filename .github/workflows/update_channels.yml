name: Auto Update IPTV Channels & Tokens

on:
  schedule:
    # Chạy mỗi 4 tiếng một lần (Token TV360 có thời hạn ~5-6 tiếng)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công bất cứ lúc nào

permissions:
  contents: write

jobs:
  update-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run token refresh script
        env:
          FILM4K_EMAIL: ${{ secrets.FILM4K_EMAIL }}
          FILM4K_PASS: ${{ secrets.FILM4K_PASS }}
          FILM4K_BASE_URL: 'https://fiml4k.fun'
        run: |
          python auto_update_channels.py


      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add danh_sach_kenh_film4k.m3u \
                  danh_sach_kenh_potplayer.m3u \
                  danh_sach_kenh_tivimate.m3u \
                  direct_streams.json \
                  channels_live.json || true
          
          if git diff --staged --quiet; then
            echo "Khong co thay doi nao can commit."
          else
            git commit -m "[bot] Cap nhat token kenh IPTV moi nhat [skip ci]"
            git push origin HEAD
          fi
